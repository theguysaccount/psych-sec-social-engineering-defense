# Test, build and deploy the site to GitHub Pages, then smoke-test the live site and ping IndexNow.
# Runs on every push to main, and weekly when refresh.yml dispatches it.
# Fails safe: any failed test or check stops before deploy, so the last good site stays live.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}     # optional key: cookieless analytics
  TEAM_VERSION_URL: ${{ vars.TEAM_VERSION_URL }}   # optional key: paid team version link

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/js/*.test.mjs
      - name: Build
        run: python3 pipeline/build.py
      - name: Play the built site end to end in headless Chrome
        run: scripts/e2e.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: urls
          path: dist/urls.txt
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  after-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: urls
      - name: Smoke-test the live site
        run: |
          for attempt in 1 2 3; do
            scripts/e2e.sh "$SITE_URL/" && exit 0
            sleep 60
          done
          exit 1
      - name: Tell search engines (IndexNow)
        run: python3 scripts/indexnow.py urls.txt
